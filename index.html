<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Гараж 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --text: #f2f3f5; --hint: #8b919e;
    --accent: #ff8a1f; --accent2: #ffb35c; --line: #262a33;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0 0 auto 0; height: 52vh; }
  #scene canvas { display: block; touch-action: none; }
  .badge { position: fixed; top: 12px; left: 12px; padding: 6px 10px; border-radius: 10px;
    background: rgba(15,17,21,.6); backdrop-filter: blur(8px); font-size: 12px; color: var(--hint); }
  .badge b { color: var(--text); font-weight: 600; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; top: calc(52vh - 18px);
    background: var(--card); border-radius: 20px 20px 0 0; padding: 16px 16px 90px; overflow-y: auto;
    box-shadow: 0 -10px 30px rgba(0,0,0,.35); }
  .price { text-align: center; margin-bottom: 14px; }
  .price .lbl { color: var(--hint); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .price .val { font-size: 28px; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; color: transparent; }
  .price .sub { color: var(--hint); font-size: 12px; }
  .row { margin: 12px 0 16px; }
  .row .top { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .row .top span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) var(--p,50%), var(--line) var(--p,50%)); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4), 0 0 0 4px rgba(255,138,31,.35); }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; }
  h3 { font-size: 12px; color: var(--hint); text-transform: uppercase; letter-spacing: .08em; margin: 20px 0 10px; font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { flex: 1 1 0; min-width: 90px; padding: 10px 8px; border-radius: 12px; border: 1.5px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-size: 13px; text-align: center; cursor: pointer; }
  .chip small { display: block; color: var(--hint); font-size: 11px; margin-top: 2px; }
  .chip.on { border-color: var(--accent); background: rgba(255,138,31,.12); }
  .colors { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .sw.on { border-color: #fff; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
  .toggle.on { border-color: var(--accent); background: rgba(255,138,31,.12); }
  .toggle small { color: var(--hint); display: block; font-size: 12px; }
  .sw2 { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: .2s; }
  .sw2::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle.on .sw2 { background: var(--accent); }
  .toggle.on .sw2::after { left: 21px; }
  #send { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 16px; border: 0; border-radius: 14px;
    font: inherit; font-weight: 700; color: #111; background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 24px rgba(255,138,31,.35); cursor: pointer; }
  body.tg #send { display: none; }
</style>
</head>
<body>
<div id="scene"></div>
<div class="badge">Площадь <b id="area">24</b> м² · крутите пальцем</div>

<div id="panel">
  <div class="price">
    <div class="lbl">Примерная стоимость</div>
    <div class="val" id="price">—</div>
    <div class="sub">под ключ: фундамент, каркас, профлист, ворота, монтаж</div>
  </div>

  <div class="row"><div class="top"><span>Ширина</span><span id="wv"></span></div>
    <input type="range" id="w" min="3" max="10" step="0.5" value="4"></div>
  <div class="row"><div class="top"><span>Длина</span><span id="lv"></span></div>
    <input type="range" id="l" min="4" max="14" step="0.5" value="6"></div>
  <div class="row"><div class="top"><span>Высота стен</span><span id="hv"></span></div>
    <input type="range" id="h" min="2.2" max="4.5" step="0.1" value="3"></div>

  <h3>Ворота</h3>
  <div class="chips" id="gates">
    <button class="chip on" data-g="swing">Распашные<small id="g_swing"></small></button>
    <button class="chip" data-g="sect">Секционные<small id="g_sect"></small></button>
    <button class="chip" data-g="roll">Рольставни<small id="g_roll"></small></button>
  </div>

  <h3>Цвет профлиста</h3>
  <div class="colors" id="colors"></div>

  <h3>Опции</h3>
  <div class="toggle" id="insul">
    <div>Утепление стен и крыши<small id="insul_p"></small></div><div class="sw2"></div>
  </div>
</div>
<button id="send">Отправить заявку</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const tg = window.Telegram?.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) { document.body.classList.add("tg"); tg.ready(); tg.expand(); tg.setHeaderColor?.("#0f1115"); tg.setBackgroundColor?.("#0f1115"); }

// ---- цены: из URL (их подставляет бот из Google-таблицы), иначе дефолт ----
const P = { fund: 18000, walls: 8800, roof: 8000, roof_k: 1.15, gate: 180000, gate_sect: 280000, gate_roll: 240000,
            insul: 3200, mount: 25, spread: 10 };
const q = new URLSearchParams(location.search);
for (const k of Object.keys(P)) if (q.has(k) && !isNaN(+q.get(k))) P[k] = +q.get(k);

const COLORS = [
  ["Графит", "#3b3f45"], ["Шоколад", "#5a3a2a"], ["Синий", "#2f5d8a"], ["Зелёный", "#2f6b45"],
  ["Вишня", "#7a2530"], ["Серый", "#9aa0a6"], ["Слоновая кость", "#e4dcc5"],
];
const state = { w: 4, l: 6, h: 3, gate: "swing", color: 0, insul: false };
const view = { w: 4, l: 6, h: 3 };   // анимируемые значения

// ---- расчёт (та же формула, что в боте) ----
function calc(s) {
  const floor = s.w * s.l, walls = 2 * (s.w + s.l) * s.h, roof = floor * P.roof_k;
  const gate = { swing: P.gate, sect: P.gate_sect, roll: P.gate_roll }[s.gate];
  let mat = floor * P.fund + walls * P.walls + roof * P.roof + gate;
  if (s.insul) mat += (walls + roof) * P.insul;
  const total = mat * (1 + P.mount / 100), sp = P.spread / 100;
  return { total, lo: Math.round(total * (1 - sp) / 1000) * 1000, hi: Math.round(total * (1 + sp) / 1000) * 1000, floor };
}
const rub = x => Math.round(x).toLocaleString("ru-RU").replace(/,/g, " ") + " ₽";
const short = x => (x / 1e6).toFixed(2).replace(".", ",") + " млн";

// ---- сцена ----
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#1a2130");
scene.fog = new THREE.Fog("#1a2130", 25, 60);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(11, 7, 13);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 6; controls.maxDistance = 30; controls.maxPolarAngle = Math.PI * 0.48;
controls.autoRotate = true; controls.autoRotateSpeed = 0.8;
controls.target.set(0, 1.5, 0);
controls.addEventListener("start", () => { controls.autoRotate = false; });

scene.add(new THREE.HemisphereLight("#cfe3ff", "#3a3226", 1.1));
const sun = new THREE.DirectionalLight("#fff1dc", 2.2);
sun.position.set(8, 14, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
scene.add(sun);

// земля
const groundTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = "#3d5a2e"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) { g.fillStyle = `hsl(${90 + Math.random() * 30},35%,${18 + Math.random() * 18}%)`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(20, 20); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// текстура профлиста: вертикальные трапеции
function profTex(vertical = true) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 8; const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 128, 0);
  grd.addColorStop(0, "#fff"); grd.addColorStop(.15, "#fff"); grd.addColorStop(.25, "#9a9a9a");
  grd.addColorStop(.5, "#c8c8c8"); grd.addColorStop(.6, "#fff"); grd.addColorStop(.85, "#e6e6e6"); grd.addColorStop(1, "#fff");
  g.fillStyle = grd; g.fillRect(0, 0, 128, 8);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  if (!vertical) t.rotation = Math.PI / 2;
  return t;
}
const wallMat = new THREE.MeshStandardMaterial({ map: profTex(), metalness: .45, roughness: .45, side: THREE.DoubleSide });
const roofMat = new THREE.MeshStandardMaterial({ map: profTex(), metalness: .5, roughness: .4, side: THREE.DoubleSide });
const slabMat = new THREE.MeshStandardMaterial({ color: "#9b9890", roughness: .95 });
const trimMat = new THREE.MeshStandardMaterial({ color: "#d9d9d9", metalness: .6, roughness: .35 });
const gateMats = {
  swing: new THREE.MeshStandardMaterial({ map: profTex(), metalness: .45, roughness: .45 }),
  sect: new THREE.MeshStandardMaterial({ map: profTex(false), color: "#f1f1ee", metalness: .3, roughness: .5 }),
  roll: new THREE.MeshStandardMaterial({ map: profTex(false), color: "#c9ccd0", metalness: .6, roughness: .35 }),
};

const garage = new THREE.Group(); scene.add(garage);
const PER_M = 4.5; // волн профлиста на метр

function panel(width, height, mat, uv = true) {
  const geo = new THREE.PlaneGeometry(width, height);
  if (uv) { const a = geo.attributes.uv; for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * width * PER_M, a.getY(i) * height); }
  const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; return m;
}
function box(w, h, d, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; }

function build() {
  garage.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  garage.clear();
  const { w, l, h } = view;
  const slabH = 0.2;

  const slab = box(w + 0.5, slabH, l + 0.5, slabMat); slab.position.y = slabH / 2; garage.add(slab);

  // боковые и задняя стены
  const left = panel(l, h, wallMat); left.rotation.y = -Math.PI / 2; left.position.set(-w / 2, slabH + h / 2, 0); garage.add(left);
  const right = panel(l, h, wallMat); right.rotation.y = Math.PI / 2; right.position.set(w / 2, slabH + h / 2, 0); garage.add(right);
  const back = panel(w, h, wallMat); back.rotation.y = Math.PI; back.position.set(0, slabH + h / 2, -l / 2); garage.add(back);

  // передняя стена с проёмом ворот
  const gw = Math.min(w - 0.8, 3.5), gh = Math.min(h - 0.35, 2.6);
  const side = (w - gw) / 2, z = l / 2;
  const fl = panel(side, h, wallMat); fl.position.set(-w / 2 + side / 2, slabH + h / 2, z); garage.add(fl);
  const fr = panel(side, h, wallMat); fr.position.set(w / 2 - side / 2, slabH + h / 2, z); garage.add(fr);
  const ft = panel(gw, h - gh, wallMat); ft.position.set(0, slabH + gh + (h - gh) / 2, z); garage.add(ft);

  // ворота
  const gm = gateMats[state.gate];
  if (state.gate === "swing") {
    for (const s of [-1, 1]) {
      const leaf = panel(gw / 2 - 0.03, gh - 0.05, gm); leaf.position.set(s * gw / 4, slabH + gh / 2, z + 0.02); garage.add(leaf);
      const handle = box(0.04, 0.25, 0.05, trimMat); handle.position.set(s * 0.12, slabH + gh / 2, z + 0.06); garage.add(handle);
    }
  } else {
    const g = panel(gw, gh, gm);
    const a = g.geometry.attributes.uv; for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * gw, a.getY(i) * gh * (state.gate === "roll" ? 9 : 2));
    g.position.set(0, slabH + gh / 2, z + 0.02); garage.add(g);
    if (state.gate === "roll") { const cas = box(gw + 0.1, 0.25, 0.25, trimMat); cas.position.set(0, slabH + gh + 0.12, z + 0.12); garage.add(cas); }
  }
  // обрамление проёма
  for (const [px, py, sw, sh] of [[-gw / 2, gh / 2, .06, gh], [gw / 2, gh / 2, .06, gh], [0, gh, gw + .06, .06]]) {
    const t = box(sw, sh, 0.06, trimMat); t.position.set(px, slabH + py, z + 0.03); garage.add(t);
  }

  // двускатная крыша вдоль длины
  const cos = 1 / P.roof_k, ang = Math.acos(Math.min(cos, 0.999)), over = 0.3;
  const half = w / 2 + over, slope = half / Math.cos(ang), rise = (w / 2) * Math.tan(ang), top = slabH + h + rise;
  for (const s of [-1, 1]) {
    const r = panel(l + over * 2, slope, roofMat);
    r.rotation.order = "YXZ"; r.rotation.y = s * Math.PI / 2; r.rotation.x = -(Math.PI / 2 - ang);
    r.position.set(s * half / 2, top - (half / 2) * Math.tan(ang), 0);
    garage.add(r);
  }
  const ridge = box(0.12, 0.08, l + over * 2, trimMat); ridge.position.set(0, top + 0.02, 0); garage.add(ridge);
  // фронтоны
  const tri = new THREE.Shape(); tri.moveTo(-w / 2, 0); tri.lineTo(w / 2, 0); tri.lineTo(0, rise); tri.closePath();
  for (const s of [-1, 1]) {
    const geo = new THREE.ShapeGeometry(tri);
    const a = geo.attributes.uv; for (let i = 0; i < a.count; i++) a.setXY(i, a.getX(i) * PER_M, a.getY(i));
    const m = new THREE.Mesh(geo, wallMat); m.castShadow = true; m.position.set(0, slabH + h, s * l / 2); garage.add(m);
  }
  // углы
  for (const [x, zz] of [[-w / 2, l / 2], [w / 2, l / 2], [-w / 2, -l / 2], [w / 2, -l / 2]]) {
    const c = box(0.07, h, 0.07, trimMat); c.position.set(x, slabH + h / 2, zz); garage.add(c);
  }
  controls.target.y = (h + rise) / 2;
}

function setColor(i) {
  const c = new THREE.Color(COLORS[i][1]);
  wallMat.color.copy(c); gateMats.swing.color.copy(c);
  roofMat.color.copy(c).multiplyScalar(0.8);
}

// ---- UI ----
const $ = id => document.getElementById(id);
const fmt = v => (+v).toFixed(1).replace(".0", "").replace(".", ",") + " м";
let shown = 0, target = 0;

function refresh() {
  for (const k of ["w", "l", "h"]) {
    const el = $(k); $(k + "v").textContent = fmt(el.value);
    el.style.setProperty("--p", ((el.value - el.min) / (el.max - el.min) * 100) + "%");
  }
  const r = calc(state);
  target = (r.lo + r.hi) / 2;
  $("area").textContent = (Math.round(r.floor * 10) / 10).toString().replace(".", ",");
  lastCalc = r;
  if (inTg) tg.MainButton.setParams({ text: `Отправить заявку · ${short(r.lo)} – ${short(r.hi)} ₽`, color: "#ff8a1f", text_color: "#111111", is_visible: true });
}
let lastCalc = calc(state);

for (const k of ["w", "l", "h"]) {
  $(k).addEventListener("input", e => { state[k] = +e.target.value; tg?.HapticFeedback?.selectionChanged(); refresh(); });
}
document.querySelectorAll("#gates .chip").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#gates .chip").forEach(x => x.classList.toggle("on", x === b));
  state.gate = b.dataset.g; tg?.HapticFeedback?.impactOccurred("light"); build(); refresh();
}));
COLORS.forEach(([name, hex], i) => {
  const s = document.createElement("div"); s.className = "sw" + (i === 0 ? " on" : ""); s.style.background = hex; s.title = name;
  s.onclick = () => { document.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === s)); state.color = i; setColor(i); tg?.HapticFeedback?.impactOccurred("light"); };
  $("colors").appendChild(s);
});
$("insul").onclick = () => { state.insul = !state.insul; $("insul").classList.toggle("on", state.insul); tg?.HapticFeedback?.impactOccurred("light"); refresh(); };

$("g_swing").textContent = "в базе";
$("g_sect").textContent = "+" + rub(P.gate_sect - P.gate);
$("g_roll").textContent = "+" + rub(P.gate_roll - P.gate);
$("insul_p").textContent = rub(P.insul) + " за м²";

function send() {
  const data = { ...state, colorName: COLORS[state.color][0], lo: lastCalc.lo, hi: lastCalc.hi };
  if (inTg) { tg.HapticFeedback?.notificationOccurred("success"); tg.sendData(JSON.stringify(data)); }
  else alert("Откройте из Telegram, чтобы отправить.\n\n" + JSON.stringify(data, null, 2));
}
$("send").onclick = send;
if (inTg) tg.MainButton.onClick(send);

// ---- цикл ----
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
setColor(0); build(); refresh(); shown = target * 0.6;

renderer.setAnimationLoop(() => {
  let changed = false;
  for (const k of ["w", "l", "h"]) {
    const d = state[k] - view[k];
    if (Math.abs(d) > 0.002) { view[k] += d * 0.18; changed = true; } else if (view[k] !== state[k]) { view[k] = state[k]; changed = true; }
  }
  if (changed) build();
  if (Math.abs(target - shown) > 500) { shown += (target - shown) * 0.15; }
  else shown = target;
  $("price").textContent = rub(Math.round(shown * (1 - P.spread / 100) / 1000) * 1000) + " – " + rub(Math.round(shown * (1 + P.spread / 100) / 1000) * 1000);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
